<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Madhura Foods</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

 <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

<style>

.register-container{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

.register-title{
    text-align:center;
    color:#ff6b00;
    font-size:42px;
    margin-bottom:30px;
}

.form-section{
    background:#fff;
    padding:30px;
    margin-bottom:25px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.section-title{
    color:#ff6b00;
    font-size:24px;
    margin-bottom:20px;
    border-left:5px solid #ff6b00;
    padding-left:10px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    border-color:#ff6b00;
    outline:none;
}

.full{
    grid-column:1 / -1;
}

.create-btn{
    width:100%;
    background:#ff6b00;
    color:white;
    border:none;
    padding:18px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.create-btn:hover{
    background:#e65c00;
}

.back-home{
    text-align:center;
    margin-top:20px;
}

.back-home a{
    color:#ff6b00;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:768px){

    .form-row{
        grid-template-columns:1fr;
    }

    .register-title{
        font-size:32px;
    }

}

</style>

</head>
<body>

<div class="register-container">

<h1 class="register-title">🍱 Create Madhura Foods Account</h1>

<form action="/signup" method="POST">

<!-- PERSONAL -->

<div class="form-section">

<h2 class="section-title">👤 Personal Information</h2>

<div class="form-row">
<input type="text" name="first_name" placeholder="First Name" required>
<input type="text" name="last_name" placeholder="Last Name" >
</div>

<div class="form-row">
<input type="text" name="father_name" placeholder="Father Name" required>
<input type="text" name="mother_name" placeholder="Mother Name">
</div>

<div class="form-row">
<input type="date" name="dob" class="full" required>
</div>

</div>

<!-- ADDRESS -->

<div class="form-section">

<h2 class="section-title">🏠 Address Information</h2>

<div class="form-row">
<input type="text" name="door_no" placeholder="Door Number" required>
<input type="text" name="house_name" placeholder="Flat / House Name">
</div>

<div class="form-row">
<input type="text" name="street" placeholder="Street / Cross" required>
<input type="text" name="landmark" placeholder="Landmark">
</div>

<div class="form-row">
<input type="text" name="city" placeholder="City" required>
<input type="text" name="state" placeholder="State" required>
</div>

<div class="form-row">
<input type="text" name="pincode" class="full" placeholder="PIN Code" required>
</div>

</div>

<!-- CONTACT -->

<div class="form-section">

<h2 class="section-title">📞 Contact Information</h2>

<div class="form-row">
<input type="tel" name="phone" class="full" placeholder="Phone Number" required>
</div>

<div class="form-row">
<input type="email" name="email" class="full" placeholder="Email Address" required>
</div>

<div class="form-row">
<input type="password" name="password" placeholder="Password" required>
<input type="password" name="confirm_password" placeholder="Confirm Password" required>
</div>

</div>

<button type="submit" class="create-btn">
CREATE ACCOUNT
</button>

</form>

<div class="back-home">
    <p>Already have an account?</p>
    <br>
    <a href="/signin" class="signin-btn" style="color:#FFFFFF">
        Sign In
    </a>
</div>
</div>

</body>
</html>
