<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Madhura Foods</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

<style>

.login-container{
    max-width:500px;
    margin:80px auto;
    padding:20px;
}

.login-card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.login-title{
    text-align:center;
    color:#ff6b00;
    font-size:40px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    border-color:#ff6b00;
    outline:none;
}

.login-btn{
    width:100%;
    background:#ff6b00;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#e65c00;
}

.signup-link{
    text-align:center;
    margin-top:20px;
}

.signup-link a{
    color:#ff6b00;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>
<body>

<nav>

    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        <span>Madhura Foods</span>
    </div>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/signin">Sign In</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>

</nav>

<div class="login-container">

    <div class="login-card">

        <h1 class="login-title">🔐 Sign In</h1>

        <form action="/login" method="POST">

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit" class="signin-btn" style="color:#FFFFFF">
        SIGN IN
    </button>

</form>

        <div class="signup-link">
            Don't have an account?
            <a href="/register">Sign Up</a>
        </div>

    </div>

</div>

</body>
</html>
